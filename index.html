  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kwikkwash - Doorstep Car Wash</title>
  <meta name="description" content="Kwikkwash provides premium doorstep car wash services with quick booking, reliable teams, and water-efficient cleaning at your location.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://kwikkwash.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kwikkwash - Doorstep Car Wash">
  <meta property="og:description" content="Premium doorstep car wash service with fast booking and reliable on-location cleaning.">
  <meta property="og:url" content="https://kwikkwash.com/">
  <meta property="og:site_name" content="Kwikkwash">
  <meta property="og:image" content="https://kwikkwash.com/washing.jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kwikkwash - Doorstep Car Wash">
  <meta name="twitter:description" content="Premium doorstep car wash service with fast booking and reliable on-location cleaning.">
  <meta name="twitter:image" content="https://kwikkwash.com/washing.jpeg">
  
  <!-- PWA Tags -->
  <meta name="theme-color" content="#F6C84C">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Icons -->
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <link rel="stylesheet" href="looks.css">
</head>
<body>
  <!-- ================= HERO ================= -->
  <section class="hero">
    <!-- HERO VIDEO -->
    <video class="heroVideo" autoplay muted loop playsinline id="heroVideo">
      <source src="/washingvd.mp4" type="video/mp4">
    </video>

    <!-- HERO IMAGE -->
    <img
      src="/washing.jpeg"
      class="heroImg"
      alt="Car wash"
      id="heroImg">

    <!-- HERO OVERLAY -->
    <div class="heroOverlay">
      <h1>Kwikkwash</h1>
      <p class="tagline">Premium Doorstep Car Wash Service</p>

      <div class="features">
        <div>At Your Location</div>
        <div>Water Efficient</div>
        <div>45-Minute Service</div>
      </div>

      <button id="ctaBtn" class="cta-button">
        <span>Step In !</span>
      </button>
      
      <button id="installBtn" class="cta-button install-btn" style="display: none;">
        <span>Install App (Recommended)</span>
      </button>

      <div id="instructionText" class="instruction-text" style="display: none;">
        <p>Add to Home Screen</p>
        <small>Tap 3 dots -> Add to Home Screen</small>
      </div>

      <div class="subtext">Fast - Clean - Reliable</div>
    </div>
  </section>

  <!-- ================= TESTIMONIALS ================= -->
  <section class="testimonialsSection">
    <!-- BACKGROUND VIDEO -->
    <video class="testVideo" autoplay muted loop playsinline>
      <source src="/washingvd.mp4" type="video/mp4">
    </video>

    <div class="testOverlay">
      <h2>Trusted by Car Owners</h2>
      <p class="testSub">Real experiences from busy people like you</p>

      <div class="testimonialSlider" id="testimonialSlider"></div>
    </div>
  </section>

  <script src="javascript.js"></script>
</body>

</html>
