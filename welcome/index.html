<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kwikkwash</title>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== LOADING ========== -->
  <div class="centerBox" id="loadingBox">
    <div class="loader"></div>
    <p>Checking login…</p>
  </div>

  <!-- ========== LOGIN ========== -->
  <div class="centerBox hidden" id="loginBox">
    <h2>Login to <span>Kwikkwash</span></h2>
    <!-- Google button will be rendered by JS -->
    <div id="googleBtn"></div>
  </div>

  <!-- ========== DASHBOARD ========== -->
  <div class="dashboard hidden" id="profileBox">
    <!-- HEADER -->
    <header class="dashHeader">
      <h1 id="welcomeText"></h1>
      <p>Your premium car care dashboard</p>
      <button class="logoutBtn" onclick="logout()">Logout</button>
    </header>
    <!-- CONTENT -->
    <div class="dashGrid">
      <!-- BOOKING -->
      <div class="glassCard">
        <h3>🚗 Book Car Wash</h3>
        <input type="text" id="mobile" placeholder="10 digit mobile number">
        <input type="text" id="address" placeholder="Service address">
        <button class="aiBtn" onclick="bookWash()">
          <span>Book Now</span>
        </button>
      </div>
      <!-- BOOKINGS -->
      <div class="glassCard">
        <h3>🧾 Recent Bookings</h3>
        <table id="bookingTable">
          <thead>
            <tr>
              <th>Mobile</th>
              <th>Location</th>
              <th>Address</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
