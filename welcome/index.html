<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kwikkwash</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN BOX -->
<div class="card" id="loginBox">
  <h2>Login to Kwikkwash</h2>

  <div id="g_id_onload"
       data-client_id="262661002432-79edenh6esvcj8ve8r7a2jd728p3fdtb.apps.googleusercontent.com"
       data-callback="handleGoogleLogin">
  </div>

  <div class="g_id_signin"
       data-type="standard"
       data-size="large">
  </div>
</div>

<!-- PROFILE / WELCOME -->
<div class="card hidden" id="profileBox">
  <h2 id="welcomeText"></h2>

  <!-- MOBILE -->
  <input type="text" id="mobile" placeholder="Enter 10 digit mobile number">

  <!-- BOOKING -->
  <h3>Book Car Wash</h3>
  <input type="text" id="address" placeholder="Enter address">
  <button onclick="bookWash()">Book Now</button>

  <!-- BOOKINGS -->
  <h3>Recent Bookings</h3>
  <table id="bookingTable">
    <thead>
      <tr>
        <th>Mobile</th>
        <th>Location</th>
        <th>Address</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script src="script.js"></script>
</body>
</html>
