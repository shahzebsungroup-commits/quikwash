<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kwikkwash – Welcome</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }
    .box {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 15px;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>Login to Kwikkwash</h2>

  <!-- Google Button -->
  <div id="g_id_onload"
       data-client_id="262661002432-79edenh6esvcj8ve8r7a2jd728p3fdtb.apps.googleusercontent.com"
       data-callback="handleGoogleLogin">
  </div>

  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="outline"
       data-text="signin_with"
       data-shape="rectangular">
  </div>
</div>

<div class="box" id="welcomeBox" style="display:none">
  <h2 id="welcomeText"></h2>
  <p>You are successfully logged in.</p>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzwssQSPMzsssvkIIoPKxeuwXFTk97RFWNmrZmmcdXY_aIl0OHbPQAV7sctzcUj6uQl6w/exec";

  function handleGoogleLogin(response) {
    const idToken = response.credential;

    // Send token to GAS for verification
    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "verify",
        token: idToken,
        device: navigator.userAgent
      })
    })
    .then(res => res.json())
    .then(data => {
      if (!data.success) {
        alert("Login failed");
        return;
      }

      // Save token locally
      localStorage.setItem("kw_token", data.appToken);
      localStorage.setItem("kw_email", data.email);

      // UI update
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("welcomeBox").style.display = "block";
      document.getElementById("welcomeText").innerText =
        "Welcome to Kwikkwash " + data.name;
    })
    .catch(err => {
      console.error(err);
      alert("Something went wrong");
    });
  }
</script>

</body>
</html>
