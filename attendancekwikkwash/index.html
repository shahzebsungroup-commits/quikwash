<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance System</title>

<style>
/* ========== MOBILE-FIRST UI ========== */
body {
    font-family: Arial;
    background: #000;
    color: #fff;
    text-align: center;
    padding: 10px;
    margin: 0;
}

.card {
    max-width: 400px;
    margin: auto;
    padding: 20px;
    border: 1px solid #F6C84C;
    border-radius: 10px;
    margin-bottom: 20px;
    width: 100%;
    box-sizing: border-box;
    background: #111;
    box-shadow: 0 4px 15px rgba(246, 200, 76, 0.1);
}

button {
    padding: 14px;
    width: 100%;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease;
    -webkit-tap-highlight-color: transparent;
}

button:active {
    transform: scale(0.98);
}

.disabled {
    background: #444;
    color: #999;
    cursor: not-allowed;
    opacity: 0.7;
    pointer-events: none;
}

.active {
    background: #F6C84C;
    color: black;
    box-shadow: 0 2px 10px rgba(246, 200, 76, 0.5);
}

.status {
    margin-top: 15px;
    font-weight: bold;
    font-size: 14px;
    color: #F6C84C;
    min-height: 40px;
    padding: 8px;
    border-radius: 5px;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Alert Message Styling */
.alert-message {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    border: 2px solid #F6C84C;
    border-radius: 10px;
    padding: 15px 25px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    z-index: 1000;
    box-shadow: 0 4px 20px rgba(246, 200, 76, 0.3);
    max-width: 80%;
    text-align: center;
    animation: slideDown 0.3s ease;
}

.alert-message.success {
    border-color: #4CAF50;
    background: #1a3a1a;
}

.alert-message.error {
    border-color: #f44336;
    background: #3a1a1a;
}

.alert-message.warning {
    border-color: #FFC107;
    background: #3a2a1a;
}

@keyframes slideDown {
    from {
        top: -100px;
        opacity: 0;
    }
    to {
        top: 20px;
        opacity: 1;
    }
}

/* Welcome Section */
.welcome-section {
    background: #111;
    border: 2px solid #F6C84C;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 4px 15px rgba(246, 200, 76, 0.1);
}

.employee-name {
    color: #F6C84C;
    font-size: 26px;
    font-weight: bold;
    margin: 5px 0;
    text-shadow: 0 2px 5px rgba(246, 200, 76, 0.3);
}

.employee-city {
    color: #fff;
    font-size: 18px;
    margin: 5px 0;
    opacity: 0.9;
}

.employee-id {
    color: #888;
    font-size: 14px;
    margin: 5px 0;
}

.instruction-box {
    background: #222;
    border-left: 4px solid #F6C84C;
    padding: 12px;
    margin: 15px 0 5px 0;
    text-align: left;
    font-size: 15px;
    border-radius: 0 5px 5px 0;
}

.instruction-box i {
    color: #F6C84C;
    margin-right: 10px;
    font-style: normal;
}

/* Date Range Section */
.date-section {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #F6C84C;
    border-radius: 10px;
    background: #111;
}

.date-filters {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 15px 0;
    flex-wrap: wrap;
}

.date-filters label {
    color: #F6C84C;
    font-weight: bold;
    font-size: 14px;
}

.date-filters input {
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #F6C84C;
    background: #222;
    color: #fff;
    margin-left: 5px;
    font-size: 14px;
    width: 130px;
}

.fetch-btn {
    background: #F6C84C;
    color: black;
    max-width: 200px;
    margin: 0 auto;
    font-size: 16px;
    padding: 12px;
    font-weight: bold;
}

/* Table Section */
.table-section {
    max-width: 1200px;
    margin: 20px auto;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #111;
    color: #fff;
    font-size: 12px;
    min-width: 600px;
    border: 1px solid #F6C84C;
}

th {
    background: #F6C84C;
    color: black;
    padding: 10px;
    font-weight: bold;
    font-size: 12px;
}

td {
    padding: 10px;
    border: 1px solid #333;
    font-size: 12px;
}

tr:hover {
    background: #222;
}

/* Today row highlight */
.today-row {
    background: #2a2a2a !important;
    border-left: 3px solid #F6C84C;
    font-weight: bold;
}

.today-row td:first-child {
    position: relative;
}

.today-row td:first-child::before {
    content: "👉";
    position: absolute;
    left: -15px;
    color: #F6C84C;
    font-size: 12px;
}

/* Empty state styling */
.empty-state {
    text-align: center;
    padding: 40px !important;
    color: #888;
    font-style: italic;
}

.empty-state i {
    color: #F6C84C;
    font-size: 24px;
    margin-bottom: 10px;
}

/* Summary Section */
.summary-section {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #F6C84C;
    border-radius: 10px;
    background: #111;
}

.summary-stats {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.stat-item {
    padding: 10px;
    background: #222;
    border-radius: 8px;
    min-width: 70px;
    flex: 1 1 auto;
    border: 1px solid #333;
}

.stat-label {
    color: #F6C84C;
    font-size: 12px;
    font-weight: bold;
}

.stat-value {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
}

/* Status Colors */
.status-full { color: #4CAF50; font-weight: bold; }
.status-late { color: #FFC107; font-weight: bold; }
.status-half { color: #FF9800; font-weight: bold; }
.status-off { color: #9E9E9E; font-weight: bold; }
.status-incomplete { color: #f44336; font-weight: bold; }

.loading {
    padding: 20px;
    color: #F6C84C;
    font-style: italic;
}

/* Location Status */
.location-status {
    font-size: 15px;
    margin: 15px 0;
    padding: 10px;
    border-radius: 8px;
    font-weight: bold;
}

.location-valid {
    background: #1a3a1a;
    color: #4CAF50;
    border: 1px solid #4CAF50;
}

.location-invalid {
    background: #3a1a1a;
    color: #f44336;
    border: 1px solid #f44336;
}

/* Mobile-specific tweaks */
@media (max-width: 480px) {
    .date-filters {
        flex-direction: column;
        align-items: center;
    }
    
    .date-filters input {
        width: 90%;
        margin: 5px 0;
    }
    
    .stat-item {
        min-width: 50px;
    }
    
    .stat-value {
        font-size: 16px;
    }
    
    .employee-name {
        font-size: 22px;
    }
    
    .alert-message {
        width: 90%;
        font-size: 14px;
        padding: 12px;
    }
    
    .today-row td:first-child::before {
        left: -5px;
    }
}
</style>
</head>

<body>

<!-- Custom Alert Container -->
<div id="customAlert" style="display: none;"></div>

<!-- ========== ATTENDANCE MARKING CARD ========== -->
<div class="card">
    <h2 style="color: #F6C84C;">📍 हाजिरी लगाएं</h2>
    
    <div id="status" class="status">शुरू हो रहा है...</div>
    <button id="markBtn" class="disabled" disabled onclick="markAttendance()">
        हाजिरी लगाएं
    </button>
</div>

<!-- ========== EMPLOYEE WELCOME SECTION ========== -->
<div class="welcome-section" id="welcomeSection" style="display: none;">
    <div class="employee-name" id="welcomeName"></div>
    <div class="employee-city" id="welcomeCity"></div>
    <div class="employee-id" id="welcomeId"></div>
    
    <div class="instruction-box">
        <i>📌</i> <span id="todayInstruction">आज की हाजिरी के लिए नीचे दिए गए बटन पर क्लिक करें</span>
    </div>
    
    <div id="locationStatus" class="location-status"></div>
</div>

<!-- ========== DATE RANGE FILTER ========== -->
<div class="date-section">
    <h3 style="color: #F6C84C;">📅 हाजिरी रिकॉर्ड</h3>
    
    <div class="date-filters">
        <div>
            <label>कब से:</label>
            <input type="date" id="fromDate">
        </div>
        <div>
            <label>कब तक:</label>
            <input type="date" id="toDate" max="">
        </div>
    </div>
    
    <button class="fetch-btn" onclick="fetchAttendance()">रिकॉर्ड दिखाएं</button>
</div>

<!-- ========== SUMMARY SECTION ========== -->
<div class="summary-section">
    <h3 style="color: #F6C84C;">📊 हाजिरी का सारांश</h3>
    <div id="summary" class="summary-stats">
        <div class="stat-item">
            <div class="stat-label">पूरा दिन</div>
            <div class="stat-value" id="summary-full">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">लेट</div>
            <div class="stat-value" id="summary-late">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">आधा दिन</div>
            <div class="stat-value" id="summary-half">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">छुट्टी</div>
            <div class="stat-value" id="summary-off">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">अधूरा</div>
            <div class="stat-value" id="summary-incomplete">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">पेट्रोल</div>
            <div class="stat-value" id="summary-petrol">0</div>
        </div>
    </div>
</div>

<!-- ========== ATTENDANCE TABLE ========== -->
<div class="table-section">
    <table>
        <thead>
            <tr>
                <th>क्र.</th>
                <th>तारीख</th>
                <th>आने का समय</th>
                <th>जाने का समय</th>
                <th>स्थिति</th>
                <th>घंटे</th>
                <th>पेट्रोल (किमी)</th>
            </tr>
        </thead>
        <tbody id="attendanceTable">
            <tr>
                <td colspan="7" style="text-align: center; padding: 30px;">तारीख चुनें और रिकॉर्ड दिखाएं</td>
            </tr>
        </tbody>
    </table>
</div>

<div id="loading" class="loading" style="display: none;">⏳ डेटा लोड हो रहा है...</div>

<script>
// ================= CONFIG =================
const EMPLOYEE_ID = "emp01"; // 🔥 हर कर्मचारी के लिए बदलें
// ==========================================

let employeeData = null;
let currentLat = null;
let currentLng = null;
let actualDistance = 0;
let isSubmitting = false;
let todayRecordCache = null;
let isCheckingToday = false;
let slowNetworkTimer = null;

// ================= CUSTOM ALERT FUNCTION =================
function showAlert(message, type = 'info', duration = 3000) {
    const alertDiv = document.getElementById('customAlert');
    
    let bgColor = '#111';
    let borderColor = '#F6C84C';
    
    if (type === 'success') {
        borderColor = '#4CAF50';
        bgColor = '#1a3a1a';
    } else if (type === 'error') {
        borderColor = '#f44336';
        bgColor = '#3a1a1a';
    } else if (type === 'warning') {
        borderColor = '#FFC107';
        bgColor = '#3a2a1a';
    }
    
    alertDiv.innerHTML = `
        <div class="alert-message ${type}" style="border-color: ${borderColor}; background: ${bgColor};">
            ${message}
        </div>
    `;
    
    alertDiv.style.display = 'block';
    
    // Vibration feedback for mobile
    if (navigator.vibrate) {
        navigator.vibrate(100);
    }
    
    setTimeout(() => {
        alertDiv.style.display = 'none';
    }, duration);
}

// ================= INIT =================
init();

function init() {
    setDefaultDateRange();
    setMaxDate();
    forceLocation();
    
    // Back button refresh issue
    window.addEventListener("focus", () => {
        console.log("Window focused - refreshing data");
        todayRecordCache = null;
        if (employeeData) {
            updateButtonState();
            fetchAttendance();
        }
    });
}

// ================= LOCAL DATE FUNCTION =================
function getLocalDate(ts) {
    const d = new Date(ts);
    return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, '0') + "-" +
        String(d.getDate()).padStart(2, '0');
}

// ================= FORMAT DATE FOR DISPLAY =================
function formatDisplayDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('hi-IN', { 
        day: '2-digit', 
        month: '2-digit', 
        year: 'numeric' 
    });
}

// ================= SET MAX DATE =================
function setMaxDate() {
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("toDate").setAttribute("max", today);
    document.getElementById("fromDate").setAttribute("max", today);
}

// ================= SET DEFAULT DATE RANGE =================
function setDefaultDateRange() {
    const today = new Date();
    const lastMonth = new Date();
    lastMonth.setMonth(today.getMonth() - 1);

    document.getElementById("toDate").value = today.toISOString().split("T")[0];
    document.getElementById("fromDate").value = lastMonth.toISOString().split("T")[0];
}

// ================= FORCE LOCATION =================
function forceLocation() {
    if (!navigator.geolocation) {
        showAlert("आपका ब्राउज़र लोकेशन सपोर्ट नहीं करता", "error");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;

            updateStatus("📍 लोकेशन मिल गई");
            verifyEmployee();
        },
        () => {
            showAlert("लोकेशन की अनुमति देना जरूरी है ⚠️", "warning");
            setTimeout(forceLocation, 2000);
        }
    );
}

// ================= VERIFY EMPLOYEE =================
function verifyEmployee() {
    updateStatus("👤 कर्मचारी की जांच हो रही है...");

    fetch("https://app.vbo.co.in/userin/settings", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            table: "employee",
            action: "get"
        })
    })
    .then(res => res.json())
    .then(res => {
        const emp = res.data.find(e => e.is_active === EMPLOYEE_ID);

        if (!emp) {
            showAlert("कर्मचारी नहीं मिला, कोड चेक करें ❌", "error");
            return;
        }

        employeeData = emp;
        
        // Show welcome section with employee details
        document.getElementById("welcomeSection").style.display = "block";
        document.getElementById("welcomeName").innerText = emp.name;
        document.getElementById("welcomeCity").innerText = `📍 ${emp.city}`;
        document.getElementById("welcomeId").innerText = `🆔 ${EMPLOYEE_ID}`;
        
        validateLocation();
        updateButtonState();
        fetchAttendance();
    })
    .catch(err => {
        showAlert("सर्वर से कनेक्शन नहीं हो पाया", "error");
        console.error(err);
    });
}

// ================= DISTANCE CALCULATION =================
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;

    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ================= VALIDATE LOCATION =================
function validateLocation() {
    if (!employeeData) return;
    
    const [lat, lng, range] = employeeData.phone.split(",").map(Number);
    actualDistance = getDistance(lat, lng, currentLat, currentLng);

    const locationDiv = document.getElementById("locationStatus");
    
    if (actualDistance <= range) {
        locationDiv.className = "location-status location-valid";
        locationDiv.innerText = `✅ आप सही जगह पर हैं (${Math.round(actualDistance)} मीटर दूर)`;
        updateButtonState();
    } else {
        locationDiv.className = "location-status location-invalid";
        locationDiv.innerText = `❌ आप तय जगह से बाहर हैं (${Math.round(actualDistance)} मीटर दूर)`;
        document.getElementById("markBtn").disabled = true;
        document.getElementById("markBtn").className = "disabled";
    }
}

// ================= GET TODAY RECORD WITH CACHE =================
async function getTodayRecord(force = false) {
    if (todayRecordCache && !force) {
        return todayRecordCache;
    }

    const today = getLocalDate(new Date());

    try {
        const res = await fetch(`https://app.vbo.co.in/userin/attendancekwikkwash?employee=${EMPLOYEE_ID}&from=${today}&to=${today}`);
        const data = await res.json();

        let record = { in: false, out: false };

        data.forEach(item => {
            if (item.type === "IN") record.in = true;
            if (item.type === "OUT") record.out = true;
        });

        todayRecordCache = record;
        return record;

    } catch {
        return { in: false, out: false };
    }
}

// ================= UPDATE BUTTON STATE =================
async function updateButtonState() {
    if (isCheckingToday) return;
    isCheckingToday = true;

    const btn = document.getElementById("markBtn");
    const instructionSpan = document.getElementById("todayInstruction");
    
    const todayRecord = await getTodayRecord();
    
    if (!todayRecord.in && !todayRecord.out) {
        const newText = "🔵 IN हाजिरी लगाएं";
        if (btn.innerText !== newText) {
            btn.innerText = newText;
        }
        instructionSpan.innerText = "👉 आज की हाजिरी शुरू करें - IN बटन दबाएं";
        btn.disabled = false;
        btn.className = "active";
    } else if (todayRecord.in && !todayRecord.out) {
        const newText = "🟠 OUT हाजिरी लगाएं";
        if (btn.innerText !== newText) {
            btn.innerText = newText;
        }
        instructionSpan.innerText = "👉 घर जाते समय OUT बटन दबाएं";
        btn.disabled = false;
        btn.className = "active";
    } else {
        const newText = "✅ हाजिरी पूरी हो चुकी";
        if (btn.innerText !== newText) {
            btn.innerText = newText;
        }
        instructionSpan.innerText = "✅ आज की हाजिरी पूरी हो चुकी है। कल फिर आएं!";
        btn.disabled = true;
        btn.className = "disabled";
    }

    isCheckingToday = false;
}

// ================= MARK ATTENDANCE WITH INSTANT LOCK =================
async function markAttendance() {
    const btn = document.getElementById("markBtn");

    // Instant UI lock (before anything)
    if (btn.disabled) return;
    btn.disabled = true;
    btn.className = "disabled";
    
    // 🧨 FIX: Set submitting flag early
    isSubmitting = true;

    // Better user feedback for slow internet
    updateStatus("⏳ कृपया इंतज़ार करें, नेटवर्क चेक हो रहा है...");

    // Network slow timer
    if (slowNetworkTimer) clearTimeout(slowNetworkTimer);
    slowNetworkTimer = setTimeout(() => {
        if (isSubmitting) {
            updateStatus("📶 नेटवर्क धीमा है, कृपया इंतज़ार करें...");
        }
    }, 4000);

    // Check employee data
    if (!employeeData) {
        showAlert("कर्मचारी डेटा नहीं मिला", "error");
        btn.disabled = false;
        btn.className = "active";
        isSubmitting = false;
        if (slowNetworkTimer) clearTimeout(slowNetworkTimer);
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;

            validateLocation();

            const [lat, lng, range] = employeeData.phone.split(",").map(Number);
            
            // Extra safety check before proceeding
            if (actualDistance > range) {
                showAlert("❌ आप तय जगह से बाहर हैं। हाजिरी नहीं लग सकती।", "error");
                btn.disabled = false;
                btn.className = "active";
                isSubmitting = false;
                if (slowNetworkTimer) clearTimeout(slowNetworkTimer);
                return;
            }

            await proceedMarkAttendance(btn);
        },
        () => {
            showAlert("लोकेशन नहीं मिल रही। कृपया अनुमति दें।", "warning");
            btn.disabled = false;
            btn.className = "active";
            isSubmitting = false;
            if (slowNetworkTimer) clearTimeout(slowNetworkTimer);
        }
    );
}

// ================= PROCEED WITH ATTENDANCE MARKING =================
async function proceedMarkAttendance(btn) {
    if (!isSubmitting) return; // Extra safety
    
    const originalText = btn.innerText;
    const loadingText = "⏳ कृपया इंतज़ार करें...";
    
    // Only update if text changed
    if (btn.innerText !== loadingText) {
        btn.innerText = loadingText;
    }

    const todayRecord = await getTodayRecord(true);

    let type = "IN";
    if (todayRecord.in && !todayRecord.out) {
        type = "OUT";
    } else if (todayRecord.in && todayRecord.out) {
        showAlert("✅ आपकी आज की हाजिरी पहले ही पूरी हो चुकी है।", "success");
        if (btn.innerText !== originalText) {
            btn.innerText = originalText;
        }
        btn.disabled = false;
        btn.className = "active";
        isSubmitting = false;
        if (slowNetworkTimer) clearTimeout(slowNetworkTimer);
        return;
    }

    const confirmMsg = type === "IN" 
        ? "🔵 IN हाजिरी लगाएं?" 
        : "🟠 OUT हाजिरी लगाएं?";
        
    if (!confirm(confirmMsg)) {
        updateStatus("रद्द किया गया");
        if (btn.innerText !== originalText) {
            btn.innerText = originalText;
        }
        btn.disabled = false;
        btn.className = "active";
        isSubmitting = false;
        if (slowNetworkTimer) clearTimeout(slowNetworkTimer);
        return;
    }

    updateStatus(`⏳ ${type} हाजिरी लग रही है...`);

    const payload = {
        employee_code: EMPLOYEE_ID,
        employee_name: employeeData.name,
        city: employeeData.city,
        lat: currentLat,
        lng: currentLng,
        permissible_distance: employeeData.phone.split(",")[2],
        actual_distance: Math.round(actualDistance),
        timestamp: new Date().toLocaleString("sv-SE"),
        type: type
    };

    fetch("https://app.vbo.co.in/userin/attendancekwikkwash", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
        // Clear slow network timer
        if (slowNetworkTimer) clearTimeout(slowNetworkTimer);
        
        // Check for server error
        if (!res || res.status === "error") {
            throw new Error(res?.message || "Server error");
        }

        const successMsg = type === "IN" 
            ? "✅ IN हाजिरी लग गई! OUT दबाएं जब घर जाएं" 
            : "✅ OUT हाजिरी लग गई! कल फिर मिलेंगे";
            
        showAlert(successMsg, "success");
        
        if (btn.innerText !== originalText) {
            btn.innerText = originalText;
        }
        
        todayRecordCache = null;
        
        fetchAttendance();
        updateButtonState();
        isSubmitting = false;
    })
    .catch((err) => {
        // Clear slow network timer
        if (slowNetworkTimer) clearTimeout(slowNetworkTimer);
        
        if (!navigator.onLine) {
            showAlert("📶 इंटरनेट कनेक्शन नहीं है", "error");
        } else {
            showAlert("❌ सर्वर से कनेक्शन नहीं हो पाया", "error");
        }
        
        if (btn.innerText !== originalText) {
            btn.innerText = originalText;
        }
        btn.disabled = false;
        btn.className = "active";
        updateButtonState();
        isSubmitting = false;
    });
}

// ================= GET ALL DATES =================
function getAllDates(from, to) {
    const dates = [];
    let current = new Date(from);
    const end = new Date(to);

    while (current <= end) {
        dates.push(getLocalDate(current));
        current.setDate(current.getDate() + 1);
    }

    return dates;
}

// ================= FETCH ATTENDANCE DATA =================
async function fetchAttendance() {
    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;

    if (!from || !to) {
        showAlert("कृपया तारीख चुनें", "warning");
        return;
    }

    const today = new Date().toISOString().split("T")[0];
    if (to > today) {
        showAlert("भविष्य की तारीख नहीं चुन सकते", "warning");
        return;
    }

    document.getElementById("loading").style.display = "block";
    document.getElementById("attendanceTable").innerHTML = '<tr><td colspan="7" style="text-align: center;">⏳ लोड हो रहा है...</td></tr>';

    try {
        const res = await fetch(`https://app.vbo.co.in/userin/attendancekwikkwash?employee=${EMPLOYEE_ID}&from=${from}&to=${to}`);
        const data = await res.json();
        
        processAttendanceData(data, from, to);
    } catch (error) {
        document.getElementById("attendanceTable").innerHTML = '<tr><td colspan="7" style="text-align: center;">❌ डेटा लोड करने में त्रुटि</td></tr>';
        showAlert("डेटा लोड करने में त्रुटि", "error");
    } finally {
        document.getElementById("loading").style.display = "none";
    }
}

// ================= PROCESS ATTENDANCE DATA =================
function processAttendanceData(data, from, to) {
    const grouped = {};

    const allDates = getAllDates(from, to);
    allDates.forEach(date => {
        grouped[date] = { in: null, out: null, petrol: 0 };
    });

    data.forEach(item => {
        const date = getLocalDate(item.timestamp);

        if (!grouped[date]) {
            grouped[date] = { in: null, out: null, petrol: 0 };
        }

        if (item.type === "IN") {
            if (!grouped[date].in || new Date(item.timestamp) < new Date(grouped[date].in)) {
                grouped[date].in = item.timestamp;
            }
        } else if (item.type === "OUT") {
            if (!grouped[date].out || new Date(item.timestamp) > new Date(grouped[date].out)) {
                grouped[date].out = item.timestamp;
            }
        }
        
        grouped[date].petrol += item.petrol_km || 0;
    });

    renderAttendanceTable(grouped);
}

// ================= CALCULATE STATUS =================
function calculateStatus(inTime, outTime) {
    if (!inTime && !outTime) return { status: "छुट्टी", hours: 0, class: "status-off" };
    if (inTime && !outTime) return { status: "अधूरा", hours: 0, class: "status-incomplete" };

    const diff = (new Date(outTime) - new Date(inTime)) / (1000 * 60 * 60);

    if (diff >= 10) return { status: "पूरा दिन", hours: diff.toFixed(1), class: "status-full" };
    if (diff >= 8.5) return { status: "लेट", hours: diff.toFixed(1), class: "status-late" };

    return { status: "आधा दिन", hours: diff.toFixed(1), class: "status-half" };
}

// ================= RENDER ATTENDANCE TABLE WITH TODAY HIGHLIGHT =================
function renderAttendanceTable(grouped) {
    const tbody = document.getElementById("attendanceTable");
    tbody.innerHTML = "";

    // Handle empty data case
    if (Object.keys(grouped).length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">📭 कोई रिकॉर्ड नहीं मिला<br><small>अलग तारीख चुनकर देखें</small></td></tr>`;
        return;
    }

    let sn = 1;
    let summary = {
        full: 0, late: 0, half: 0, off: 0, incomplete: 0, petrol: 0
    };

    const sortedDates = Object.keys(grouped).sort().reverse();
    const today = getLocalDate(new Date());

    sortedDates.forEach(date => {
        const record = grouped[date];
        const result = calculateStatus(record.in, record.out);

        if (result.status === "पूरा दिन") summary.full++;
        else if (result.status === "लेट") summary.late++;
        else if (result.status === "आधा दिन") summary.half++;
        else if (result.status === "छुट्टी") summary.off++;
        else if (result.status === "अधूरा") summary.incomplete++;

        summary.petrol += record.petrol || 0;

        const row = document.createElement("tr");
        
        // Highlight today's row
        if (date === today) {
            row.className = "today-row";
        }
        
        row.innerHTML = `
            <td>${sn++}</td>
            <td>${formatDisplayDate(date)}</td>
            <td>${formatTime(record.in)}</td>
            <td>${formatTime(record.out)}</td>
            <td class="${result.class}">${result.status}</td>
            <td>${result.hours > 0 ? result.hours + 'h' : '-'}</td>
            <td>${record.petrol || 0}</td>
        `;
        tbody.appendChild(row);
    });

    renderSummary(summary);
}

// ================= RENDER SUMMARY =================
function renderSummary(s) {
    document.getElementById("summary-full").innerText = s.full;
    document.getElementById("summary-late").innerText = s.late;
    document.getElementById("summary-half").innerText = s.half;
    document.getElementById("summary-off").innerText = s.off;
    document.getElementById("summary-incomplete").innerText = s.incomplete;
    document.getElementById("summary-petrol").innerText = s.petrol;
}

// ================= FORMAT TIME HELPER =================
function formatTime(ts) {
    if (!ts) return "-";
    try {
        const d = new Date(ts);
        return d.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
    } catch {
        return "-";
    }
}

// ================= UI UPDATE HELPER =================
function updateStatus(msg) {
    document.getElementById("status").innerText = msg;
}

// Auto refresh button state every 30 seconds
setInterval(() => {
    if (employeeData) {
        updateButtonState();
    }
}, 30000);
